<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ABADA.AI — Coming soon</title>
<meta name="description" content="ABADA.AI: the AI briefing for leaders who build. Coming soon.">
<!-- Keeps search engines from listing this holding page. Remove this line at launch. -->
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,500;6..72,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F7F7FB;--ink:#15133D;--muted:#4E4C74;--line:#DFDEEC;--accent-ink:#2F2A93;--green:#00D47E;
    --serif:'Newsreader',Georgia,serif;--sans:'IBM Plex Sans',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root{--bg:#0D0B24;--ink:#EEEDFB;--muted:#ADAAD3;--line:#2A2756;--accent-ink:#2EF2A0;--green:#2EF2A0;}
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased;
       display:flex;flex-direction:column;min-height:100vh}
  a:focus-visible{outline:3px solid var(--accent-ink);outline-offset:3px}
  .wrap{width:100%;max-width:1100px;margin:0 auto;padding:0 clamp(20px,5vw,64px)}
  header .wrap{display:flex;align-items:center;gap:10px;padding-top:24px;padding-bottom:24px}
  .wordmark{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:.02em}
  .wordmark span{color:var(--accent-ink)}
  main{flex:1;display:flex;align-items:center}
  main .wrap{padding-top:clamp(40px,8vh,96px);padding-bottom:clamp(40px,8vh,96px)}
  .eyebrow{margin:0 0 20px;font-family:var(--mono);font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);display:flex;align-items:center;gap:10px}
  .eyebrow::before{content:"";width:8px;height:8px;border-radius:999px;background:var(--green)}
  h1{margin:0;max-width:900px;font-family:var(--serif);font-weight:500;font-size:clamp(44px,7vw,92px);line-height:1.02;letter-spacing:-.02em}
  .lede{margin:28px 0 0;max-width:620px;font-size:clamp(18px,1.8vw,21px);color:var(--muted)}
  .cta{margin-top:40px;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px}
  .btn{display:inline-flex;align-items:center;min-height:52px;padding:0 28px;border-radius:999px;background:var(--green);color:#0B0A2A;font-weight:600;text-decoration:none}
  .btn:hover{filter:brightness(1.06)}
  .note{font-size:15px;color:var(--muted)}
  footer{border-top:1px solid var(--line)}
  footer .wrap{padding-top:24px;padding-bottom:24px;font-size:14px;color:var(--muted)}
</style>
</head>
<body>
<header>
  <div class="wrap">
    <svg width="34" height="34" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="#2F2A93"/><path d="M9 24 L16 8 L23 24" fill="none" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="16" cy="19" r="2.8" fill="#2EF2A0"/></svg>
    <span class="wordmark">ABADA<span>.AI</span></span>
  </div>
</header>
<main>
  <div class="wrap">
    <p class="eyebrow">Coming soon</p>
    <h1>The AI briefing for leaders who build.</h1>
    <p class="lede">Agentic AI and automation, explained for business leaders and the builders who work with them. We're putting the finishing touches on it.</p>
    <div class="cta">
      <a class="btn" href="mailto:hello@abada.ai">hello@abada.ai</a>
      <span class="note">Want early access? Drop us a line.</span>
    </div>
  </div>
</main>
<footer>
  <div class="wrap">© <span id="y">2026</span> ABADA.AI</div>
</footer>
<script>document.getElementById('y').textContent=new Date().getFullYear();</script>
</body>
</html>
